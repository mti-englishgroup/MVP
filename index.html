<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Project X – MTI Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-banner">
        <div class="brand">
            <div class="brand-logo">x</div>
            <div class="brand-text">
                <h1>Project X</h1>
                <span>MTI PROJECT</span>
            </div>
        </div>
        <div class="leopard-pattern"></div>
    </header>

    <main class="main-container">
        <!-- Левая колонка: Ввод -->
        <div class="column">
            <div class="card-wrapper">
                <textarea id="input-text" placeholder="Введите исходный комментарий..."></textarea>
            </div>
            <div class="label-title">Исходный комментарий</div>

            <div class="controls-panel">
                <select id="tone-select">
                    <option value="neutral">Строгий нейтральный</option>
                    <option value="mentor">Менторский / Развивающий</option>
                    <option value="concise">Краткий лаконичный</option>
                </select>
                <button id="process-btn">Преобразовать</button>
            </div>
        </div>

        <!-- Правая колонка: Результат -->
        <div class="column">
            <div class="card-wrapper output-wrapper" id="output-section">
                <div class="result-box" id="result-text">Здесь появится преобразованный текст...</div>
                
                <div class="inspector" id="inspector-box">
                    <span id="inspector-metric">Инспектор токсичности: ожидает анализа</span>
                </div>

                <div class="feedback">
                    <span>Оценить:</span>
                    <button class="feedback-btn" data-vote="up">👍</button>
                    <button class="feedback-btn" data-vote="down">👎</button>
                </div>
            </div>
            <div class="label-title">Результат</div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
